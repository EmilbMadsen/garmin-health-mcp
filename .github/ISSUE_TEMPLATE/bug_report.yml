name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Remove personal and health data before posting:** API keys, tokens, activity IDs, and
        any values from your sleep, heart rate, weight or activities. Do not paste raw output from
        `scripts/discover.py` or tool results.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you asked or ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or command
      placeholder: e.g. get_sleep_summaries, get_activity_splits, garmin-health-mcp setup
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: |
        The tool error, or the end of the server log. Claude Desktop on macOS logs to
        `~/Library/Logs/Claude/mcp-server-garmin-health.log`. The server never logs response
        bodies, but check anyway.
      render: text
  - type: input
    id: mode
    attributes:
      label: Mode and client
      placeholder: e.g. stdio in Claude Desktop, or serve --http behind claude.ai
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`uv pip show garmin-health-mcp garmin-connect-personal-api-python`, or the commit you run from."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed keys, tokens, activity IDs and health values from this issue.
          required: true
