[project]
name = "garmin-health-mcp"
version = "0.1.0"
description = "Unofficial, read-only MCP server for the Garmin Connect Personal API (not affiliated with Garmin)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Emil Madsen" }]
requires-python = ">=3.13"
keywords = ["mcp", "model-context-protocol", "garmin", "garmin-connect", "health", "fit", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "garmin-connect-personal-api-python>=1.0,<2",
    "garmin-fit-sdk>=21",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "mcp-owner-auth>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/EmilbMadsen/garmin-health-mcp"
Issues = "https://github.com/EmilbMadsen/garmin-health-mcp/issues"
Changelog = "https://github.com/EmilbMadsen/garmin-health-mcp/releases"

[project.scripts]
garmin-health-mcp = "garmin_health_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["keyring.*", "garmin_personal_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
